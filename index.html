<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vocabulary → Contextual Transfer</title>

    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>

        /* ==============================
           GLOBAL
        ============================== */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {

            margin: 0;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f3f5f7;

            color: #202124;

            line-height: 1.8;
        }


        /* ==============================
           HEADER
        ============================== */

        header {

            background: #1f2937;

            color: white;

            padding: 45px 20px;

            text-align: center;

        }

        header h1 {

            margin: 0;

            font-size: 32px;

            font-weight: 700;

            letter-spacing: 0.3px;

        }

        header p {

            margin: 10px 0 0;

            color: #d1d5db;

            font-size: 16px;

        }


        /* ==============================
           MAIN CONTAINER
        ============================== */

        main {

            max-width: 1000px;

            margin: 40px auto;

            padding: 0 20px;

        }


        /* ==============================
           CONTENT CARD
        ============================== */

        .content-card {

            background: white;

            padding: 45px;

            border-radius: 16px;

            box-shadow:
                0 4px 20px rgba(0,0,0,0.06);

        }


        /* ==============================
           MARKDOWN CONTENT
        ============================== */

        #content {

            font-size: 17px;

        }


        #content h1 {

            font-size: 30px;

            margin-top: 0;

            margin-bottom: 25px;

        }


        #content h2 {

            margin-top: 40px;

            padding-bottom: 8px;

            border-bottom: 2px solid #e5e7eb;

        }


        #content h3 {

            margin-top: 30px;

        }


        #content p {

            margin: 16px 0;

        }


        /* ==============================
           LINKS
        ============================== */

        #content a {

            color: #2563eb;

            text-decoration: none;

        }

        #content a:hover {

            text-decoration: underline;

        }


        /* ==============================
           TABLE
        ============================== */

        .table-wrapper {

            overflow-x: auto;

            margin: 25px 0;

        }


        #content table {

            width: 100%;

            border-collapse: collapse;

            min-width: 650px;

        }


        #content th,
        #content td {

            border: 1px solid #d1d5db;

            padding: 12px 14px;

            text-align: left;

            vertical-align: top;

        }


        #content th {

            background: #f3f4f6;

            font-weight: 700;

        }


        #content tr:nth-child(even) {

            background: #fafafa;

        }


        /* ==============================
           BLOCKQUOTE
        ============================== */

        #content blockquote {

            margin: 25px 0;

            padding: 15px 20px;

            border-left: 4px solid #6b7280;

            background: #f9fafb;

            color: #4b5563;

        }


        /* ==============================
           CODE
        ============================== */

        #content code {

            background: #f1f5f9;

            padding: 3px 6px;

            border-radius: 5px;

            font-family: Consolas, monospace;

        }


        /* ==============================
           IMAGES
        ============================== */

        #content img {

            max-width: 100%;

            height: auto;

            display: block;

            margin: 25px auto;

            border-radius: 10px;

        }


        /* ==============================
           HORIZONTAL RULE
        ============================== */

        #content hr {

            border: 0;

            border-top: 1px solid #e5e7eb;

            margin: 35px 0;

        }


        /* ==============================
           FOOTER
        ============================== */

        footer {

            text-align: center;

            padding: 30px 20px;

            color: #6b7280;

            font-size: 14px;

        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 700px) {

            header {

                padding: 30px 15px;

            }

            header h1 {

                font-size: 25px;

            }

            main {

                margin: 20px auto;

                padding: 0 12px;

            }

            .content-card {

                padding: 25px 20px;

                border-radius: 12px;

            }

            #content {

                font-size: 16px;

            }

        }

    </style>

</head>


<body>


    <!-- ==============================
         HEADER
    ============================== -->

    <header>

        <h1>
            Vocabulary → Contextual Transfer
        </h1>

        <p>
            Advanced English Vocabulary Learning
        </p>

    </header>


    <!-- ==============================
         MAIN CONTENT
    ============================== -->

    <main>

        <section class="content-card">

            <div id="content">

                Loading...

            </div>

        </section>

    </main>


    <!-- ==============================
         FOOTER
    ============================== -->

    <footer>

        Vocabulary Contextual Transfer

    </footer>


    <!-- ==============================
         LOAD MARKDOWN
    ============================== -->

    <script>

        const markdownFile =
            "Vocabulary%20%E2%86%92%20Contextual%20Transfer.md";


        fetch(markdownFile)

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Could not load Markdown file."
                    );

                }

                return response.text();

            })


            .then(markdown => {

                document.getElementById("content").innerHTML =
                    marked.parse(markdown);

            })


            .catch(error => {

                document.getElementById("content").innerHTML = `

                    <h2>⚠️ Error</h2>

                    <p>
                        ${error.message}
                    </p>

                `;

            });

    </script>


</body>

</html>
