<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vocabulary → Contextual Transfer</title>

    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px 20px;
            line-height: 1.8;
        }

        .container {
            max-width: 950px;
            margin: auto;
            background: white;
            padding: 45px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        #content {
            font-size: 17px;
        }

        h1, h2, h3, h4, h5 {
            line-height: 1.4;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 25px 0;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px 12px;
            text-align: left;
        }

        th {
            background: #f0f0f0;
        }

        blockquote {
            border-left: 4px solid #888;
            margin: 20px 0;
            padding: 10px 20px;
            background: #f7f7f7;
        }

        code {
            background: #f0f0f0;
            padding: 2px 5px;
            border-radius: 4px;
        }

        hr {
            margin: 30px 0;
        }

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 25px;
            }

            table {
                display: block;
                overflow-x: auto;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div id="content">
            Loading...
        </div>

    </div>


    <script>

        const markdownFile =
            "Vocabulary%20%E2%86%92%20Contextual%20Transfer.md";


        fetch(markdownFile)
            .then(response => {

                if (!response.ok) {
                    throw new Error(
                        "Could not load Markdown file."
                    );
                }

                return response.text();

            })

            .then(markdown => {

                document.getElementById("content").innerHTML =
                    marked.parse(markdown);

            })

            .catch(error => {

                document.getElementById("content").innerHTML = `
                    <h2>⚠️ Error</h2>
                    <p>${error.message}</p>
                `;

            });

    </script>

</body>

</html>
