<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vocabulary → Contextual Transfer</title>

    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            line-height: 1.8;
        }

        header {
            padding: 30px 20px;
            text-align: center;
            background: #1f2937;
            color: white;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 8px 0 0;
            color: #d1d5db;
        }

        main {
            max-width: 950px;
            margin: 35px auto;
            padding: 0 20px;
        }

        #content {
            background: white;
            padding: 40px;
            border-radius: 12px;
        }

        #content h1 {
            margin-top: 0;
        }

        #content h2 {
            margin-top: 35px;
            padding-bottom: 6px;
            border-bottom: 1px solid #ddd;
        }

        #content a {
            color: #2563eb;
        }

        /* Mixed Persian + English text */
        #content p,
        #content li,
        #content blockquote,
        #content h1,
        #content h2,
        #content h3,
        #content h4,
        #content h5,
        #content h6,
        #content th,
        #content td {
            direction: auto;
        }

        /* Tables */
        #content table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        #content th,
        #content td {
            border: 1px solid #ddd;
            padding: 10px 12px;
            vertical-align: top;
        }

        #content th {
            background: #f3f4f6;
        }

        /* Code and technical text */
        #content code,
        #content pre {
            direction: ltr;
            text-align: left;
        }

        /* Blockquotes */
        #content blockquote {
            margin: 20px 0;
            padding: 10px 20px;
            border-left: 4px solid #999;
            background: #f8f8f8;
        }

        /* Images */
        #content img {
            max-width: 100%;
            height: auto;
        }

        footer {
            text-align: center;
            padding: 25px 20px;
            color: #777;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            header h1 {
                font-size: 24px;
            }

            main {
                margin: 20px auto;
                padding: 0 12px;
            }

            #content {
                padding: 25px 20px;
            }

            #content table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Vocabulary → Contextual Transfer</h1>
        <p>Advanced English Vocabulary Learning</p>
    </header>

    <main>
        <div id="content">
            Loading...
        </div>
    </main>

    <footer>
        Vocabulary → Contextual Transfer
    </footer>

    <script>
        const markdownFile =
            "Vocabulary%20%E2%86%92%20Contextual%20Transfer.md";

        fetch(markdownFile)
            .then(response => {
                if (!response.ok) {
                    throw new Error("Could not load Markdown file.");
                }

                return response.text();
            })

            .then(markdown => {

                const content =
                    document.getElementById("content");

                content.innerHTML =
                    marked.parse(markdown);

                /*
                 * Automatically detect RTL / LTR
                 * for each block of content.
                 */
                const elements = content.querySelectorAll(
                    "h1, h2, h3, h4, h5, h6, p, li, blockquote, th, td"
                );

                elements.forEach(element => {
                    element.setAttribute("dir", "auto");
                });

            })

            .catch(error => {

                document.getElementById("content").innerHTML = `
                    <h2>⚠️ Error</h2>
                    <p>${error.message}</p>
                `;

            });
    </script>

</body>

</html>
